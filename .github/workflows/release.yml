name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit belongs to main
        shell: powershell
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit contained in origin/main.'
          }

      - name: Install pinned validation modules
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force

      - name: Validate release input
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Validate-Repository.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Invoke-StaticAnalysis.ps1
          Import-Module Pester -RequiredVersion 5.7.1 -Force -ErrorAction Stop
          Invoke-Pester -Path tests -Output Detailed -CI

  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      commit-sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record the resolved tagged commit
        id: commit
        shell: powershell
        run: |
          $sha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Unable to resolve the tagged commit.' }
          "sha=$sha" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Validate tag, notes, acceptance, and PowerShell syntax
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must be canonical SemVer vMAJOR.MINOR.PATCH: $version"
          }
          $notesPath = Join-Path $PWD "docs/releases/$version.md"
          $acceptancePath = Join-Path $PWD "docs/acceptance/$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Reviewed release notes are missing: $notesPath"
          }
          $notes = Get-Content -LiteralPath $notesPath -Raw -Encoding UTF8
          foreach ($heading in @("# $version", '## Catalog and pins', '## Manual actions', '## Known limitations')) {
            if ($notes -notmatch ('(?m)^' + [regex]::Escape($heading) + '\s*$')) {
              throw "Release notes are missing required heading: $heading"
            }
          }
          if (-not (Test-Path -LiteralPath $acceptancePath -PathType Leaf)) {
            throw "Windows 11 VM acceptance evidence is missing: $acceptancePath"
          }
          $acceptance = Get-Content -LiteralPath $acceptancePath -Raw -Encoding UTF8
          $evidenceFields = @(
            'Runtime fingerprint', 'Accepted archive SHA-256', 'Candidate commit',
            'Candidate workflow run URL', 'Acceptance toolkit commit', 'Attestation verification',
            'Windows ISO/build', 'Gateway ISO/build', 'Test date range', 'Tester', 'Evidence URL'
          )
          $evidenceValues = @{}
          foreach ($field in $evidenceFields) {
            $pattern = '(?m)^-\s*' + [regex]::Escape($field) + ':\s*(.+?)\s*$'
            $match = [regex]::Match($acceptance, $pattern)
            if (-not $match.Success) {
              throw "Windows 11 VM acceptance is missing evidence field: $field"
            }
            $value = $match.Groups[1].Value.Trim()
            if ([string]::IsNullOrWhiteSpace($value) -or $value -match '^(?i:PENDING|TODO|TBD|N/A)$') {
              throw "Windows 11 VM acceptance evidence is incomplete: $field"
            }
            $evidenceValues[$field] = $value
          }
          if ($evidenceValues['Runtime fingerprint'] -cnotmatch '^sha256:[0-9a-f]{64}$' -or
              $evidenceValues['Accepted archive SHA-256'] -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Acceptance fingerprints must use canonical lowercase SHA-256.'
          }
          foreach ($commitField in @('Candidate commit', 'Acceptance toolkit commit')) {
            if ($evidenceValues[$commitField] -cnotmatch '^[0-9a-f]{40}$') {
              throw "Acceptance commit must be a canonical full commit: $commitField"
            }
            git cat-file -e "$($evidenceValues[$commitField])^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Acceptance commit is not in the fetched repository: $commitField" }
            git merge-base --is-ancestor $evidenceValues[$commitField] HEAD
            if ($LASTEXITCODE -ne 0) { throw "Acceptance commit is not an ancestor of the release: $commitField" }
          }
          if ($evidenceValues['Attestation verification'] -cnotmatch '^(?i:verified)$') {
            throw 'Acceptance provenance must have a verified result.'
          }
          $dateMatch = [regex]::Match($evidenceValues['Test date range'], '^(\d{4}-\d{2}-\d{2}) to (\d{4}-\d{2}-\d{2})$')
          if (-not $dateMatch.Success) { throw 'Test date range must use YYYY-MM-DD to YYYY-MM-DD.' }
          $startDate = [datetime]::MinValue
          $endDate = [datetime]::MinValue
          if (-not [datetime]::TryParseExact($dateMatch.Groups[1].Value, 'yyyy-MM-dd', [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::None, [ref]$startDate) -or
              -not [datetime]::TryParseExact($dateMatch.Groups[2].Value, 'yyyy-MM-dd', [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::None, [ref]$endDate)) {
            throw 'Test date range contains an invalid calendar date.'
          }
          if ($endDate -lt $startDate -or ($endDate - $startDate).TotalDays -gt 6) {
            throw 'Formal acceptance must finish within seven natural days.'
          }
          foreach ($urlField in @('Candidate workflow run URL', 'Evidence URL')) {
            $evidenceUri = $null
            if (-not [Uri]::TryCreate($evidenceValues[$urlField], [UriKind]::Absolute, [ref]$evidenceUri) -or
                $evidenceUri.Scheme -ne [Uri]::UriSchemeHttps -or -not [string]::IsNullOrEmpty($evidenceUri.UserInfo)) {
              throw "Acceptance URL must be credential-free absolute HTTPS: $urlField"
            }
          }
          if ($evidenceValues['Candidate workflow run URL'] -cnotmatch '^https://github\.com/UnbalancedCat/win11-bootstrap/actions/runs/[0-9]+$' -or
              $evidenceValues['Evidence URL'] -cne 'https://github.com/UnbalancedCat/win11-bootstrap/issues/1') {
            throw 'Acceptance URLs must identify this repository candidate run and Issue #1.'
          }
          foreach ($imageField in @('Windows ISO/build', 'Gateway ISO/build')) {
            if ($evidenceValues[$imageField] -cnotmatch '(?i)sha-?256:[0-9a-f]{64}' -or
                $evidenceValues[$imageField] -cnotmatch '(?i)build') {
              throw "Acceptance image identity must contain a SHA-256 and build: $imageField"
            }
          }
          $actualFingerprint = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Get-RuntimeFingerprint.ps1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualFingerprint -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Unable to compute the canonical runtime fingerprint.'
          }
          if ($evidenceValues['Runtime fingerprint'] -cne $actualFingerprint) {
            throw 'Windows 11 VM acceptance evidence belongs to different runtime content.'
          }
          if ($acceptance -match '(?m)^\s*-\s*\[\s\]') {
            throw 'Windows 11 VM acceptance still contains unchecked scenarios.'
          }
          $requiredScenarioIds = 1..11 | ForEach-Object { 'VM-{0:d3}' -f $_ }
          foreach ($scenarioId in $requiredScenarioIds) {
            $scenarioPattern = '(?m)^\s*-\s*\[[xX]\]\s+`' + [regex]::Escape($scenarioId) + '`\s+\S.*$'
            if ([regex]::Matches($acceptance, $scenarioPattern).Count -ne 1) {
              throw "Windows 11 VM acceptance must contain exactly one completed scenario: $scenarioId"
            }
          }
          if ([regex]::Matches($acceptance, '(?m)^\s*-\s*\[[xX]\]').Count -ne 11) {
            throw 'Windows 11 VM acceptance contains unexpected or missing completed scenarios.'
          }
          if ($acceptance -notmatch '(?m)^Status:\s+\*\*release-approved\*\*\.\s*$') {
            throw 'Windows 11 VM acceptance status is not release-approved.'
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Validate-Repository.ps1
          $parseErrors = @()
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1,*.psd1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) { throw 'PowerShell syntax validation failed.' }

      - name: Build release archive and checksum
        id: bundle
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME
          $output = Join-Path $PWD 'release-bundle'
          $acceptance = Get-Content -LiteralPath "docs/acceptance/$version.md" -Raw -Encoding UTF8
          $match = [regex]::Match($acceptance, '(?m)^-\s*Accepted archive SHA-256:\s*([0-9a-f]{64})\s*$')
          if (-not $match.Success) { throw 'Accepted archive SHA-256 is missing.' }
          $bundle = & tests/New-ReleaseBundle.ps1 -Version $version -OutputDirectory $output -ExpectedArchiveSha256 $match.Groups[1].Value
          $archive = $bundle.ArchivePath
          Copy-Item -LiteralPath (Join-Path $PWD "docs/releases/$version.md") -Destination (Join-Path $output 'RELEASE_NOTES.md')
          "archive=$(Resolve-Path $archive)" | Out-File $env:GITHUB_OUTPUT -Encoding ascii -Append
          $expectedBundleItems = @(
            "win11-bootstrap-$version.zip",
            "win11-bootstrap-$version.zip.sha256",
            'RELEASE_NOTES.md'
          )
          $actualAssets = @(Get-ChildItem -LiteralPath $output -Force | ForEach-Object { $_.Name } | Sort-Object)
          if (($actualAssets -join "`n") -cne (($expectedBundleItems | Sort-Object) -join "`n")) {
            throw 'Release output contains missing or unexpected assets.'
          }

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ steps.bundle.outputs.archive }}

      - name: Upload release bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download the build job artifact by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-bundle
          merge-multiple: true

      - name: Verify release bundle checksum
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME
          $bundleRoot = (Resolve-Path -LiteralPath release-bundle -ErrorAction Stop).Path
          $archive = Join-Path $bundleRoot "win11-bootstrap-$version.zip"
          $checksumFile = "$archive.sha256"
          $notes = Join-Path $bundleRoot 'RELEASE_NOTES.md'
          $expectedBundleItems = @([IO.Path]::GetFileName($archive), [IO.Path]::GetFileName($checksumFile), 'RELEASE_NOTES.md')
          $actualItems = @(Get-ChildItem -LiteralPath $bundleRoot -Force)
          if (($actualItems | Where-Object { $_.PSIsContainer }).Count -ne 0 -or
              (($actualItems.Name | Sort-Object) -join "`n") -cne (($expectedBundleItems | Sort-Object) -join "`n")) {
            throw 'Downloaded release bundle contains missing or unexpected assets.'
          }
          $line = (Get-Content -LiteralPath $checksumFile -Raw -Encoding ascii).Trim()
          $expectedChecksumName = [regex]::Escape([IO.Path]::GetFileName($archive))
          if ($line -notmatch "^([0-9a-f]{64})\s{2}$expectedChecksumName$") { throw 'Release checksum format is invalid.' }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ine $Matches[1]) { throw 'Release bundle SHA-256 mismatch.' }
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'Release notes are missing.' }

      - name: Publish an immutable GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          $bundleRoot = (Resolve-Path -LiteralPath release-bundle -ErrorAction Stop).Path
          $archive = Join-Path $bundleRoot "win11-bootstrap-$version.zip"
          $checksum = "$archive.sha256"
          $notes = Join-Path $bundleRoot 'RELEASE_NOTES.md'
          foreach ($path in @($archive, $checksum, $notes)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Release asset is missing: $path" }
          }

          $apiHeaders = @(
            '-H', 'Accept: application/vnd.github+json',
            '-H', 'X-GitHub-Api-Version: 2026-03-10'
          )
          $expectedAssets = @(
            [pscustomobject]@{
              Name = [IO.Path]::GetFileName($archive)
              Size = [long](Get-Item -LiteralPath $archive).Length
              Digest = 'sha256:' + (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            },
            [pscustomobject]@{
              Name = [IO.Path]::GetFileName($checksum)
              Size = [long](Get-Item -LiteralPath $checksum).Length
              Digest = 'sha256:' + (Get-FileHash -LiteralPath $checksum -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          )
          if ($expectedAssets.Count -ne 2) { throw 'Exactly two Release assets are required.' }

          function Invoke-GitHubApiJson {
            param([Parameter(Mandatory = $true)][string]$Endpoint)

            $json = & gh api @apiHeaders $Endpoint
            if ($LASTEXITCODE -ne 0) { throw "GitHub API request failed: $Endpoint" }
            return ($json | ConvertFrom-Json)
          }

          function Get-RemoteTagCommit {
            $reference = Invoke-GitHubApiJson -Endpoint "repos/$env:GH_REPO/git/ref/tags/$version"
            $target = $reference.object
            foreach ($depth in 1..5) {
              if ([string]$target.type -ceq 'commit') { break }
              if ([string]$target.type -cne 'tag' -or [string]::IsNullOrWhiteSpace([string]$target.sha)) {
                throw 'The remote release tag does not resolve to a commit.'
              }
              $tag = Invoke-GitHubApiJson -Endpoint "repos/$env:GH_REPO/git/tags/$($target.sha)"
              $target = $tag.object
            }
            if ([string]$target.type -cne 'commit' -or [string]$target.sha -cnotmatch '^[0-9a-f]{40}$') {
              throw 'The remote release tag could not be peeled to one canonical commit.'
            }
            return [string]$target.sha
          }

          function Assert-ExpectedTagCommit {
            $remoteCommit = Get-RemoteTagCommit
            if ($remoteCommit -cne $env:BUILD_COMMIT) {
              throw 'The remote release tag moved after the reviewed build completed.'
            }
          }

          function Get-ReleaseById {
            param([Parameter(Mandatory = $true)][long]$ReleaseId)

            return Invoke-GitHubApiJson -Endpoint "repos/$env:GH_REPO/releases/$ReleaseId"
          }

          function Assert-ReleaseIdentityAndAssets {
            param(
              [Parameter(Mandatory = $true)]$Release,
              [Parameter(Mandatory = $true)][bool]$ExpectedDraft,
              [Parameter(Mandatory = $true)][bool]$ExpectedImmutable
            )

            if ([long]$Release.id -ne $releaseId -or [string]$Release.tag_name -cne $version) {
              throw 'The GitHub API returned a different Release object.'
            }
            if ([bool]$Release.draft -ne $ExpectedDraft -or [bool]$Release.immutable -ne $ExpectedImmutable) {
              throw 'The Release lifecycle state is not the expected state.'
            }
            $actualAssets = @($Release.assets)
            if ($actualAssets.Count -ne $expectedAssets.Count) {
              throw "Release asset count mismatch: expected $($expectedAssets.Count), found $($actualAssets.Count)."
            }
            foreach ($expected in $expectedAssets) {
              $matches = @($actualAssets | Where-Object { [string]$_.name -ceq $expected.Name })
              if ($matches.Count -ne 1) {
                throw "Release must contain exactly one asset named $($expected.Name)."
              }
              $actualAsset = $matches[0]
              if ([string]$actualAsset.state -cne 'uploaded' -or
                  [long]$actualAsset.size -ne $expected.Size -or
                  [string]$actualAsset.digest -cne $expected.Digest) {
                throw "Release asset metadata mismatch: $($expected.Name)."
              }
            }
          }

          Assert-ExpectedTagCommit
          $releaseId = [long]0
          $draftCreated = $false
          try {
            & gh release create $version $archive $checksum `
              --verify-tag --draft --notes-file $notes --title $version
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the draft release.' }
            $draftCreated = $true

            # Capture the unique object once from the exact-tag endpoint. Every
            # subsequent Release read, update, and cleanup is tied to this ID.
            $createdRelease = $null
            foreach ($attempt in 1..6) {
              try {
                $candidate = Invoke-GitHubApiJson -Endpoint "repos/$env:GH_REPO/releases/tags/$version"
                if ([string]$candidate.tag_name -cne $version -or [long]$candidate.id -le 0) {
                  throw 'The exact-tag endpoint returned an invalid Release identity.'
                }
                $createdRelease = $candidate
                break
              }
              catch {
                if ($attempt -eq 6) { throw }
                Start-Sleep -Seconds 5
              }
            }
            if ($null -eq $createdRelease) { throw 'The newly created Release ID could not be captured.' }
            $releaseId = [long]$createdRelease.id

            $draftReady = $false
            foreach ($attempt in 1..6) {
              try {
                $draftRelease = Get-ReleaseById -ReleaseId $releaseId
                Assert-ReleaseIdentityAndAssets -Release $draftRelease -ExpectedDraft $true -ExpectedImmutable $false
                $draftReady = $true
                break
              }
              catch {
                if ($attempt -eq 6) { throw }
                Start-Sleep -Seconds 5
              }
            }
            if (-not $draftReady) { throw 'Draft release assets did not become verifiable.' }

            # Close the tag-move and asset-mutation windows immediately before
            # making the reviewed object public.
            Assert-ExpectedTagCommit
            $prePublishRelease = Get-ReleaseById -ReleaseId $releaseId
            Assert-ReleaseIdentityAndAssets -Release $prePublishRelease -ExpectedDraft $true -ExpectedImmutable $false
            $publishedJson = & gh api @apiHeaders --method PATCH "repos/$env:GH_REPO/releases/$releaseId" -F 'draft=false'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the draft release by ID.' }
            $publishedRelease = $publishedJson | ConvertFrom-Json
            if ([long]$publishedRelease.id -ne $releaseId) { throw 'GitHub published a different Release object.' }

            # The standard GITHUB_TOKEN cannot read repository Administration
            # settings, so verify the concrete Release object's immutable flag.
            $lockedRelease = $null
            foreach ($attempt in 1..6) {
              $candidate = Get-ReleaseById -ReleaseId $releaseId
              if ([bool]$candidate.immutable) {
                $lockedRelease = $candidate
                break
              }
              Assert-ReleaseIdentityAndAssets -Release $candidate -ExpectedDraft $false -ExpectedImmutable $false
              Start-Sleep -Seconds 5
            }
            if ($null -eq $lockedRelease) {
              throw 'Published release did not become immutable within the verification window.'
            }
            Assert-ReleaseIdentityAndAssets -Release $lockedRelease -ExpectedDraft $false -ExpectedImmutable $true
            Assert-ExpectedTagCommit
          }
          catch {
            $failureMessage = $_.Exception.Message
            if ($releaseId -le 0) {
              if ($draftCreated) {
                throw "A draft was created, but its unique Release ID could not be captured; no ambiguous cleanup was attempted and maintainer action is required. Original failure: $failureMessage"
              }
              throw
            }

            $cleanupRelease = $null
            try {
              $cleanupRelease = Get-ReleaseById -ReleaseId $releaseId
            }
            catch {
              throw "Release $releaseId failed validation, but its immutable state could not be read; no deletion was attempted and maintainer action is required. Original failure: $failureMessage"
            }
            if ([long]$cleanupRelease.id -ne $releaseId -or [string]$cleanupRelease.tag_name -cne $version) {
              throw "Release $releaseId failed validation, but cleanup identity verification failed; no deletion was attempted and maintainer action is required. Original failure: $failureMessage"
            }
            if ([bool]$cleanupRelease.immutable) {
              throw "Immutable Release $releaseId failed final validation; no deletion was attempted and maintainer action is required. Original failure: $failureMessage"
            }

            & gh api @apiHeaders --method DELETE "repos/$env:GH_REPO/releases/$releaseId"
            if ($LASTEXITCODE -ne 0) {
              throw "Mutable Release $releaseId failed validation and automatic cleanup failed; maintainer action is required. Original failure: $failureMessage"
            }
            throw "Mutable Release $releaseId failed validation and was removed by ID. Original failure: $failureMessage"
          }
